<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Horizon</title>
  <style>
    .stem { fill: #ecedf3; }
    .line { fill: #9a86ff; }
    @media (prefers-color-scheme: light) {
      .stem { fill: #16181f; }
      .line { fill: #5b3fd6; }
    }
  </style>
  <g class="stem">
    <rect x="4" y="3" width="2" height="4"/>
    <rect x="10" y="3" width="2" height="4"/>
  </g>
  <g class="stem" opacity=".36">
    <rect x="4" y="8" width="2" height="4"/>
    <rect x="10" y="8" width="2" height="4"/>
  </g>
  <rect class="line" x="1" y="7" width="14" height="1"/>
</svg>
