name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (release or debug)"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      target:
        description: "Target Architecture"
        required: true
        type: choice
        options:
          - aarch64
          - armv7
          - all
        default: aarch64


permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Accept licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Check for pre-installed NDK or install
          NDK_BASE="/usr/local/lib/android/sdk/ndk"
          if [ -d "$NDK_BASE" ] && [ "$(ls -A $NDK_BASE 2>/dev/null)" ]; then
            SELECTED_NDK=$(ls -d $NDK_BASE/* | sort -V | tail -n 1)
            echo "Using pre-installed NDK at: $SELECTED_NDK"
          else
            echo "Installing NDK 26.1.10909125..."
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            SELECTED_NDK="$NDK_BASE/26.1.10909125"
          fi
          echo "NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV
          echo "$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "TARGET_AR=$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV


      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Inject Foreground Service and Android Manifest Permissions
        run: node scripts/prepare-android.cjs

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          TARGET="${{ github.event.inputs.target || 'aarch64' }}"

          TARGET_ARGS=""
          if [ "$TARGET" != "all" ]; then
            TARGET_ARGS="--target $TARGET"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            pnpm tauri android build --apk --debug $TARGET_ARGS
          else
            pnpm tauri android build --apk $TARGET_ARGS
          fi

      - name: Sign Output APK
        run: |
          mkdir -p output-apks
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"

          # 1. Generate release signing key
          keytool -genkey -v -keystore release.jks -alias ingot -keyalg RSA -keysize 2048 -validity 10000 -storepass ingot123 -keypass ingot123 -dname "CN=Ingot, OU=Ingot, O=Ingot, L=Unknown, S=Unknown, C=US"

          # 2. Locate apksigner and sign the APK
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          FINAL_APK="output-apks/Ingot-Server-Host-aarch64.apk"
          $APKSIGNER sign --ks release.jks --ks-pass pass:ingot123 --out "$FINAL_APK" "$RAW_APK"

          # 3. Verify signature
          $APKSIGNER verify "$FINAL_APK"
          ls -lh output-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingot-server-host-apks
          path: output-apks/*.apk
          retention-days: 14

