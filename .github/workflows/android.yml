name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (release or debug)"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      target:
        description: "Target Architecture"
        required: true
        type: choice
        options:
          - aarch64
          - armv7
          - all
        default: aarch64
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Accept licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Check for pre-installed NDK or install
          NDK_BASE="/usr/local/lib/android/sdk/ndk"
          if [ -d "$NDK_BASE" ] && [ "$(ls -A $NDK_BASE 2>/dev/null)" ]; then
            SELECTED_NDK=$(ls -d $NDK_BASE/* | sort -V | tail -n 1)
            echo "Using pre-installed NDK at: $SELECTED_NDK"
          else
            echo "Installing NDK 26.1.10909125..."
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            SELECTED_NDK="$NDK_BASE/26.1.10909125"
          fi
          echo "NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV


      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Inject Foreground Service and Android Manifest Permissions
        run: node scripts/prepare-android.cjs

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          TARGET="${{ github.event.inputs.target || 'aarch64' }}"

          TARGET_ARGS=""
          if [ "$TARGET" != "all" ]; then
            TARGET_ARGS="--target $TARGET"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            pnpm tauri android build --apk --debug $TARGET_ARGS
          else
            pnpm tauri android build --apk $TARGET_ARGS
          fi

      - name: Collect Output APKs
        run: |
          mkdir -p output-apks
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output-apks/ \;
          ls -lh output-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingot-server-host-apks
          path: output-apks/*.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Attaching APKs to release $TAG..."
          for i in {1..12}; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" output-apks/*.apk --clobber && echo "Successfully uploaded APKs to $TAG" && break
            fi
            echo "Waiting for release $TAG to be created... (attempt $i/12)"
            sleep 15
          done

