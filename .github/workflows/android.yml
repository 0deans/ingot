name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (release or debug)"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      target:
        description: "Target Architecture"
        required: true
        type: choice
        options:
          - aarch64
          - armv7
          - all
        default: aarch64

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

          # Accept licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Check for pre-installed NDK or install
          NDK_BASE="/usr/local/lib/android/sdk/ndk"
          if [ -d "$NDK_BASE" ] && [ "$(ls -A $NDK_BASE 2>/dev/null)" ]; then
            SELECTED_NDK=$(ls -d $NDK_BASE/* | sort -V | tail -n 1)
            echo "Using pre-installed NDK at: $SELECTED_NDK"
          else
            echo "Installing NDK 26.1.10909125..."
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            SELECTED_NDK="$NDK_BASE/26.1.10909125"
          fi
          echo "NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV
          echo "$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "TARGET_AR=$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$SELECTED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          TARGET="${{ github.event.inputs.target || 'aarch64' }}"

          TARGET_ARGS=""
          if [ "$TARGET" != "all" ]; then
            TARGET_ARGS="--target $TARGET"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            pnpm tauri android build --apk --debug $TARGET_ARGS
          else
            pnpm tauri android build --apk $TARGET_ARGS
          fi

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p output-apks
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          # Test builds may use a one-off key when the release secrets aren't available
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          bash scripts/sign-android-apk.sh "$RAW_APK" "output-apks/Ingot_${VERSION}_aarch64.apk" --allow-throwaway-key
          ls -lh output-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ingot-android-apks
          path: output-apks/*.apk
          retention-days: 14
