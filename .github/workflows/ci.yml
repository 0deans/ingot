name: CI

# Fast checks on every push and pull request, so breakage shows up before a release
on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript and Biome
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p .

      # `biome ci` checks formatting and lint without changing files
      - name: Lint and format check
        run: pnpm exec biome ci

  rust:
    name: Rust tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dbus-x11 \
            gnome-keyring

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri embeds the built frontend at compile time; the tests don't need the real one
      - name: Placeholder frontend build
        shell: bash
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>Ingot</title>' > dist/index.html

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Test native desktop vault
        working-directory: src-tauri
        if: runner.os != 'Linux'
        run: cargo test --lib --locked keyring_store::tests::native_vault_round_trip -- --ignored --exact

      - name: Test Linux Secret Service
        working-directory: src-tauri
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ci-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --lib --locked keyring_store::tests::native_vault_round_trip -- --ignored --exact
          '
