name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            rust_targets: "x86_64-apple-darwin,aarch64-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            mobile: "android"
            rust_targets: "aarch64-linux-android"
            args: "--apk --target aarch64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.mobile || 'desktop' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Android keystore
        if: matrix.mobile == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ingot.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ingot.keystore" >> $GITHUB_ENV

      - name: Setup Java 21
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set NDK_HOME and initialize Android project
        if: matrix.mobile == 'android'
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          pnpm tauri android init --ci

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure app ID for Microsoft sign-in (public, so a repository variable)
          INGOT_MSA_CLIENT_ID: ${{ vars.INGOT_MSA_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Ingot v__VERSION__"
          releaseBody: "Download Ingot for Windows, Linux, macOS, and Android below."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          # Point the Windows updater at the NSIS installer instead of the MSI:
          # an MSI upgrade reinstalls every component, recreating the desktop
          # shortcut, while NSIS in update mode only refreshes existing ones.
          updaterJsonPreferNsis: true
          mobile: ${{ matrix.mobile || '' }}
          uploadUpdaterJson: ${{ matrix.mobile != 'android' }}
          releaseAssetNamePattern: ${{ matrix.mobile == 'android' && '[name]_[version]_[arch][ext]' || '' }}
          args: ${{ matrix.args }}

      - name: Clean up Android keystore
        if: always() && matrix.mobile == 'android'
        run: rm -f "$RUNNER_TEMP/ingot.keystore"

      - name: Package and upload Windows Portable (.exe & .zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $exeName = "Ingot_${version}_x64_portable.exe"
          $zipName = "Ingot_${version}_x64_portable.zip"

          Write-Host "Packaging portable builds for $tag..."
          # 1. Standalone Portable EXE
          Copy-Item "src-tauri/target/release/ingot.exe" -Destination $exeName

          # 2. Portable ZIP (containing Ingot.exe)
          New-Item -ItemType Directory -Force -Path "portable-staging" | Out-Null
          Copy-Item "src-tauri/target/release/ingot.exe" -Destination "portable-staging/Ingot.exe"
          Compress-Archive -Path "portable-staging/*" -DestinationPath $zipName -Force

          Write-Host "Uploading $exeName and $zipName to release $tag..."
          gh release upload $tag $exeName $zipName --clobber
