[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.5.17"
authors = ["0deans <https://github.com/0deans>"]
license = "GPL-3.0-only"
edition = "2021"

[workspace.dependencies]
ingot-accounts = { path = "crates/accounts" }
ingot-artifacts = { path = "crates/artifacts" }
ingot-content = { path = "crates/content" }
ingot-core = { path = "crates/core" }
ingot-minecraft = { path = "crates/minecraft" }
ingot-sandbox = { path = "crates/sandbox" }
ingot-server = { path = "crates/server" }
ingot-server-map = { path = "crates/server-map" }
ingot-settings = { path = "crates/settings" }
ingot-test-support = { path = "crates/test-support" }
ingot-tunnel = { path = "crates/tunnel" }
ingot-version-change = { path = "crates/version-change" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
keyring = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
uuid = { version = "1", features = ["v4", "v3"] }
taurpc = "0.8.2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2"
sha1 = "0.11.0"
toml_edit = "0.25"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
indexmap = { version = "2", features = ["serde"] }
tar = "0.4"
fastnbt = "2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md5 = { version = "0.11", package = "md-5" }
if-addrs = "0.15.0"
sha2 = "0.11.0"
bedrock-world = "0.3.5"
libc = "0.2"
mslnk = "0.1.8"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[package]
name = "ingot"
version.workspace = true
description = "Lightweight, open-source Minecraft launcher"
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ingot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }
dotenvy = { workspace = true }

[dependencies]
ingot-accounts = { workspace = true }
ingot-artifacts = { workspace = true }
ingot-content = { workspace = true }
ingot-core = { workspace = true }
ingot-minecraft = { workspace = true }
ingot-sandbox = { workspace = true }
ingot-server = { workspace = true }
ingot-server-map = { workspace = true }
ingot-settings = { workspace = true }
ingot-tunnel = { workspace = true }
ingot-version-change = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
taurpc = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true }
sysinfo = { workspace = true }
base64 = { workspace = true }
tauri-plugin-dialog = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["test-util"] }
zip = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test.package."*"]
opt-level = 2
debug = 0

[profile.dev.build-override]
opt-level = 0
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
