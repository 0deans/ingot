[package]
name = "ingot"
version = "0.5.8"
description = "Lightweight, open-source Minecraft launcher"
authors = ["0deans <https://github.com/0deans>"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ingot_lib"
# Use ["rlib"] for fast desktop dev/test linking; add "staticlib", "cdylib" only when building for Android/iOS
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
keyring = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls", "http2", "stream"] }
uuid = { version = "1", features = ["v4", "v3"] }
taurpc = "0.8.2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2"
sha1 = "0.11.0"
toml_edit = "0.25"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
indexmap = { version = "2", features = ["serde"] }
tar = "0.4"
fastnbt = "2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md5 = { version = "0.11", package = "md-5" }
if-addrs = "0.15.0"
sha2 = "0.11.0"
bedrock-world = "0.3.5"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test.package."*"]
opt-level = 2
debug = 0

[profile.dev.build-override]
opt-level = 0
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true