[package]
name = "ingot"
version = "0.4.6"
description = "Lightweight, open-source Minecraft launcher"
authors = ["0deans <https://github.com/0deans>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ingot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v3"] }
taurpc = "0.8.2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2"
sha1 = "0.11.0"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
tar = "0.4"
fastnbt = "2"
png = "0.18"
md5 = { version = "0.10", package = "md-5" }
if-addrs = "0.15.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
